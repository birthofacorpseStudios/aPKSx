name: Build APKStation PKG
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl libicu-dev
          sudo apt-get install -y dotnet-sdk-8.0 || true
      - name: Install OpenOrbis Toolchain
        run: |
          cd /tmp
          curl -L -o toolchain.tar.gz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          tar -xzf toolchain.tar.gz
          sudo mkdir -p /opt/openorbis
          sudo rm -rf /opt/openorbis/*
          sudo cp -r OpenOrbis/PS4Toolchain/* /opt/openorbis/
          sudo cp -v /opt/openorbis/bin/linux/* /opt/openorbis/bin/ || true
          sudo chmod +x /opt/openorbis/bin/*
          echo "/opt/openorbis/bin" >> $GITHUB_PATH
      - name: Build PKG
        run: |
          export OO_PS4_TOOLCHAIN=/opt/openorbis
          export PATH=/opt/openorbis/bin:$PATH
          # Recreate folders that flat repo removed
          mkdir -p core ui android sce_sys assets/images
          cp -v pad.* core/ 2>/dev/null; cp -v filesystem.* config.* core/ 2>/dev/null
          cp -v pointer.* launcher.* ui/ 2>/dev/null
          cp -v apk_manager.* vm_manager.* android/ 2>/dev/null
          cp -v icon0.png pic0.png pic1.png sce_sys/ 2>/dev/null
          cp -v bg*.png icon_app.png assets/images/ 2>/dev/null || true
          make clean
          make
          ls -lh *.pkg || find . -name "*.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: APKStation-Offline-v1
          path: "*.pkg"
